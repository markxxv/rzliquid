<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>rzliquid — liquid mercury & glass</title>
<meta name="description" content="Интерактивная арт-инсталляция: жидкая ртуть и разбитое стекло на three.js">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; opacity: 0; transition: opacity 1.4s ease; }
  canvas#scene.on { opacity: 1; }
  #fps { position: fixed; right: 12px; top: 10px; z-index: 3; font: 11px ui-monospace, monospace; color: #8f8; display: none; pointer-events: none; }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; color: #ccc; font: 14px sans-serif; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fps"></div>
<noscript>Нужен JavaScript и WebGL2.</noscript>
<script type="module" src="./js/main.js"></script>
</body>
</html>
